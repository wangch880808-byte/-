<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知教·智慧教育课程平台 - 教师端</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: #f0f2f5; color: #333; font-size: 14px;
    display: flex; flex-direction: column;
  }

  /* 顶部栏 */
  .app-header {
    height: 56px; flex-shrink: 0;
    background: #fff; border-bottom: 1px solid #e8e8e8;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; z-index: 10;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo img { width: 30px; height: 30px; object-fit: contain; }
  .logo b { font-size: 17px; color: #1f2d3d; font-weight: 600; }
  .header-right { display: flex; align-items: center; gap: 20px; color: #666; font-size: 13px; }
  .header-right .item { cursor: pointer; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: #1890ff; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; cursor: pointer;
  }

  /* 主体布局 */
  .layout { display: flex; flex: 1; min-height: 0; }

  /* 左侧目录 */
  .sidebar {
    width: 232px; flex-shrink: 0;
    background: #fafafa; border-right: 1px solid #e8e8e8;
    overflow-y: auto; padding: 8px 0 20px;
  }
  .menu-group-title {
    padding: 10px 16px; font-size: 13px; color: #333; font-weight: 600;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; user-select: none;
  }
  .menu-group-title:hover { color: #1890ff; }
  .menu-group-title .arrow { transition: transform .2s; color: #999; font-size: 12px; }
  .menu-group.collapsed .arrow { transform: rotate(-90deg); }
  .menu-group.collapsed .menu-items { display: none; }
  .menu-items { list-style: none; }
  .menu-subhead {
    list-style: none;
    padding: 10px 16px 4px 34px; font-size: 12px; color: #b0b0b0;
  }
  .menu-item {
    display: block; text-decoration: none;
    padding: 9px 16px 9px 34px; font-size: 13px; color: #555;
    cursor: pointer; user-select: none; position: relative;
  }
  .menu-item:hover { color: #1890ff; background: #f0f5ff; }
  .menu-item.active { color: #1890ff; background: #e6f4ff; font-weight: 600; }
  .menu-item.active::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: #1890ff;
  }

  /* 右侧内容区 */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .breadcrumb {
    height: 44px; flex-shrink: 0; background: #fff;
    border-bottom: 1px solid #f0f0f0;
    display: flex; align-items: center; gap: 6px;
    padding: 0 20px; font-size: 13px; color: #999;
  }
  .breadcrumb .cur { color: #333; }
  .tabs {
    height: 40px; flex-shrink: 0; background: #fff; border-bottom: 1px solid #f0f0f0;
    display: flex; align-items: center; gap: 4px; padding: 0 12px; overflow-x: auto;
  }
  .tab {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; font-size: 13px; color: #555; background: #f5f5f5;
    border: 1px solid #e8e8e8; border-radius: 4px 4px 0 0; white-space: nowrap;
  }
  .tab.active { color: #1890ff; background: #fff; border-bottom: 2px solid #1890ff; font-weight: 600; }
  .tab-link { color: inherit; text-decoration: none; }
  .tab-close {
    border: none; background: transparent; color: #999; font-size: 14px; line-height: 1;
    cursor: pointer; padding: 0 2px;
  }
  .tab-close:hover { color: #d4380d; }
  .content {
    flex: 1; margin: 16px; background: #fff; border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #bbb; gap: 8px;
  }
  .content .page-title { font-size: 18px; color: #666; }
  .content .hint { font-size: 13px; }
  body.auth-pending > .app-header, body.auth-pending > .layout { visibility: hidden; }
  #authStatus { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 12px; color: #555; background: #f0f2f5; z-index: 20; }
  #authStatus[hidden], #authRetry[hidden] { display: none; }
  #authRetry, .logout-button { border: 1px solid #d9d9d9; background: #fff; border-radius: 4px; padding: 5px 10px; color: #555; cursor: pointer; font: inherit; }
  #authRetry:hover, .logout-button:hover { color: #1890ff; border-color: #1890ff; }
  #pageBody { width: 100%; }
  #pageBody[hidden] { display: none; }
  #defaultHint { font-size: 13px; }
</style>
<link rel="stylesheet" href="/classroom.css">
</head>
<body class="auth-pending" data-role="teacher">
  <div id="authStatus" role="status"><span id="authMessage">正在核验登录信息…</span><button type="button" id="authRetry" hidden>重试</button></div>
  <header class="app-header">
    <div class="logo">
      <img src="/logo.png" alt="校徽">
      <b>知教·智慧教育课程平台</b>
    </div>
    <div class="header-right">
      <span class="item">当前学期：2026-2027-1</span>
      <span class="item">通知</span>
      <span class="item">设置</span>
      <span class="avatar">师</span>
      <button type="button" class="logout-button" id="logoutBtn">退出登录</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="breadcrumb" id="breadcrumb"></div>
      <div class="tabs" id="tabs"></div>
      <div class="content">
        <div class="page-title" id="pageTitle"></div>
        <div class="hint" id="defaultHint">内容区（待实现）</div>
        <div id="pageBody" hidden></div>
      </div>
    </main>
  </div>

<script src="/js/api-client.js"></script>
<script src="/js/classroom-api.js"></script>
<script src="/js/classroom-pages.js"></script>
<script>
var ROLE = 'teacher';
var currentGi = 0, currentIi = 0;

var MENU = [
  { name: '教学工作台', children: ['教学总览', '今日课程 / 快捷上课', '教学待办', '班级消息 / 公告', 'AI 教学助手'] },
  { name: '我的课程',  children: ['课程详情', '课程建设', '课前准备', '课堂教学', '课后作业与反馈', '学情分析与教学改进', 'AI 教学助手'] }
];

function render() {
  var sb = document.getElementById('sidebar');
  var html = '';
  for (var i = 0; i < MENU.length; i++) {
    var g = MENU[i];
    var collapsed = i === 0 ? '' : 'collapsed';
    html += '<div class="menu-group ' + collapsed + '" data-group="' + i + '">';
    html += '<div class="menu-group-title"><span>' + g.name + '</span><span class="arrow">▾</span></div>';
    html += '<ul class="menu-items">';
    for (var j = 0; j < g.children.length; j++) {
      if (g.subhead && g.subhead.at === j) {
        html += '<li class="menu-subhead">' + g.subhead.label + '</li>';
      }
      html += '<li><a class="menu-item" href="?g=' + i + '&i=' + j + '">' + g.children[j] + '</a></li>';
    }
    html += '</ul></div>';
  }
  sb.innerHTML = html;

  // 展开/折叠
  sb.querySelectorAll('.menu-group-title').forEach(function (t) {
    t.addEventListener('click', function () {
      var grp = t.parentNode;
      grp.classList.toggle('collapsed');
    });
  });
}

function select(gi, ii) {
  document.querySelectorAll('.menu-item').forEach(function (m) { m.classList.remove('active'); });
  var groups = document.querySelectorAll('.menu-group');
  var items = groups[gi].querySelectorAll('.menu-item');
  if (items[ii]) items[ii].classList.add('active');

  var g = MENU[gi];
  document.getElementById('breadcrumb').innerHTML =
    g.name + ' <span>&gt;</span> <span class="cur">' + g.children[ii] + '</span>';
  document.getElementById('pageTitle').textContent = g.children[ii];
  if (window.ClassroomPages && ClassroomPages.render('teacher', g.children[ii])) {
    return;
  }
  if (window.ClassroomPages) ClassroomPages.resetContent();
}

var TAB_KEY = 'zhijiao_tabs_' + ROLE;

function getTabs() {
  try { return JSON.parse(localStorage.getItem(TAB_KEY) || '[]'); } catch (e) { return []; }
}
function saveTabs(tabs) { try { localStorage.setItem(TAB_KEY, JSON.stringify(tabs)); } catch (e) {} }

function addTab(gi, ii) {
  var tabs = getTabs();
  for (var t = 0; t < tabs.length; t++) {
    if (tabs[t].g === gi && tabs[t].i === ii) { tabs.splice(t, 1); break; }
  }
  tabs.push({ g: gi, i: ii, name: MENU[gi].children[ii] });
  if (tabs.length > 15) tabs = tabs.slice(tabs.length - 15);
  saveTabs(tabs);
}

function renderTabs() {
  var box = document.getElementById('tabs');
  var tabs = getTabs();
  if (tabs.length === 0) tabs = [{ g: currentGi, i: currentIi, name: MENU[currentGi].children[currentIi] }];
  var html = '';
  for (var t = 0; t < tabs.length; t++) {
    var active = (tabs[t].g === currentGi && tabs[t].i === currentIi) ? ' active' : '';
    html += '<span class="tab' + active + '">'
      + '<a class="tab-link" href="?g=' + tabs[t].g + '&i=' + tabs[t].i + '">' + tabs[t].name + '</a>'
      + '<button class="tab-close" data-g="' + tabs[t].g + '" data-i="' + tabs[t].i + '">&times;</button>'
      + '</span>';
  }
  box.innerHTML = html;
  box.querySelectorAll('.tab-close').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      closeTab(parseInt(btn.getAttribute('data-g'), 10), parseInt(btn.getAttribute('data-i'), 10));
    });
  });
}

function closeTab(g, i) {
  var tabs = getTabs();
  var idx = -1;
  for (var t = 0; t < tabs.length; t++) {
    if (tabs[t].g === g && tabs[t].i === i) { idx = t; break; }
  }
  if (idx < 0) return;
  var wasActive = (g === currentGi && i === currentIi);
  tabs.splice(idx, 1);
  saveTabs(tabs);
  if (wasActive) {
    if (tabs.length > 0) {
      var next = tabs[Math.min(idx, tabs.length - 1)];
      location.href = '?g=' + next.g + '&i=' + next.i;
    } else {
      location.href = '?g=0&i=0';
    }
  } else {
    renderTabs();
  }
}

function init() {
  render();
  var gi = 0, ii = 0;
  var q = location.search;
  var m = q.match(/[?&]g=(\d+)/); if (m) gi = parseInt(m[1], 10);
  var n = q.match(/[?&]i=(\d+)/); if (n) ii = parseInt(n[1], 10);
  if (gi >= MENU.length) gi = 0;
  if (ii >= MENU[gi].children.length) ii = 0;
  currentGi = gi; currentIi = ii;
  addTab(gi, ii);
  var groups = document.querySelectorAll('.menu-group');
  for (var k = 0; k < groups.length; k++) groups[k].classList.add('collapsed');
  groups[gi].classList.remove('collapsed');
  select(gi, ii);
  renderTabs();
}

init();
</script>
<script src="/role-home.js"></script>
</body>
</html>
