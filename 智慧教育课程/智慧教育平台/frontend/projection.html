<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课堂投影 - 知教</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #111; color: #fff; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  .projection {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;
  }
  .projection .page-no {
    font-size: 72px;
    font-weight: 700;
    color: #40a9ff;
    margin-bottom: 16px;
  }
  .projection .hint {
    font-size: 20px;
    color: #888;
    margin-bottom: 32px;
  }
  .projection .slide-box {
    width: min(90vw, 960px);
    aspect-ratio: 16 / 9;
    background: #1a1a1a;
    border: 2px solid #333;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: #555;
    margin-bottom: 24px;
  }
  .projection .meta {
    font-size: 14px;
    color: #666;
  }
  .projection .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 4px;
    background: #177ddc;
    color: #fff;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .projection .notice {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #444;
  }
  .projection .activity {
    margin-top: 16px;
    font-size: 16px;
    color: #aaa;
  }
</style>
</head>
<body>
  <div class="projection">
    <span class="badge" id="statusBadge">加载中</span>
    <div class="page-no" id="pageNo">—</div>
    <div class="hint" id="courseHint">课堂投影公开视图</div>
    <div class="slide-box" id="slideBox">课件预览占位</div>
    <div class="activity" id="activityHint"></div>
    <div class="meta" id="sessionMeta"></div>
  </div>
  <div class="notice">仅显示公开信息 · 不含教师备注、答案与学生成绩</div>

<script src="/js/api-client.js"></script>
<script>
(function () {
  'use strict';

  const params = new URLSearchParams(location.search);
  const sessionId = params.get('sessionId');

  function render(snapshot) {
    const status = snapshot.status || 'PLANNED';
    const statusMap = {
      PLANNED: ['未开课', '#666'],
      RUNNING: ['进行中', '#177ddc'],
      PAUSED: ['已暂停', '#d48806'],
      ENDED: ['已结束', '#389e0d']
    };
    const badge = statusMap[status] || statusMap.PLANNED;
    document.getElementById('statusBadge').textContent = badge[0];
    document.getElementById('statusBadge').style.background = badge[1];
    document.getElementById('pageNo').textContent = '第 ' + (snapshot.pageNo || 1) + ' 页';
    document.getElementById('courseHint').textContent = '课堂投影 · 公开快照';
    document.getElementById('sessionMeta').textContent =
      '会话 ' + (snapshot.sessionId || sessionId || '—') + ' · seq ' + (snapshot.stateSeq || '—');
    document.getElementById('slideBox').textContent =
      status === 'PLANNED' ? '等待教师开始上课' : '第 ' + (snapshot.pageNo || 1) + ' 页课件预览';

    const activity = snapshot.openActivity;
    const activityEl = document.getElementById('activityHint');
    if (activity && activity.status === 'OPEN') {
      let text = activity.title || activity.activityKind;
      if (activity.activityKind === 'QUIZ' && activity.question) {
        text += '：' + (activity.question.stem || '');
      }
      activityEl.textContent = text;
    } else {
      activityEl.textContent = '';
    }
  }

  async function pollSnapshot() {
    if (!sessionId) {
      render({ status: 'PLANNED', pageNo: 1 });
      return;
    }
    try {
      const result = await ZhijiaoApi.get(
        '/education/classroom/sessions/' + encodeURIComponent(sessionId) + '/snapshot?view=public'
      );
      render(result.data || {});
    } catch {
      render({ sessionId: sessionId, status: 'PLANNED', pageNo: 1 });
    }
  }

  pollSnapshot();
  setInterval(pollSnapshot, 3000);
})();
</script>
</body>
</html>
