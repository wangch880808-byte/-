<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧教学平台 - 管理员登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    /* 第二张图：青色渐变背景，左下偏白，右上偏青 */
    background:
      radial-gradient(1200px 800px at 100% 0%, rgba(165, 240, 245, 0.9) 0%, rgba(165, 240, 245, 0) 60%),
      radial-gradient(900px 700px at 0% 100%, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0) 55%),
      linear-gradient(135deg, #ffffff 0%, #dff6f8 45%, #b8eef2 75%, #a4e9ef 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 6vw;
    overflow-x: hidden;
  }

  /* 背景装饰圆 */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(2px);
    opacity: .45;
    pointer-events: none;
    z-index: 0;
  }
  .blob-1 { width: 340px; height: 340px; background: #a4e9ef; top: -120px; left: -100px; }
  .blob-2 { width: 260px; height: 260px; background: #ffffff; bottom: -80px; right: -60px; opacity: .6; }

  /* 左右布局 */
  .stage {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 48px;
    width: 100%;
    max-width: 1160px;
    position: relative;
    z-index: 1;
  }
  .stage-left { flex: 1; min-width: 0; }
  .stage-right {
    flex-shrink: 0;
  }

  /* 左侧品牌区：校徽在上、平台名称居中、介绍在下 */
  .brand {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 20px;
  }
  .brand-logo {
    width: 300px;
    height: 300px;
    object-fit: contain;
    filter: drop-shadow(0 10px 22px rgba(0, 0, 0, .20));
  }
  .brand-name { font-size: 42px; font-weight: 700; color: #2b3446; letter-spacing: 2px; }
  .brand-intro { font-size: 16px; color: #8a97ab; line-height: 1.8; max-width: 540px; }

  /* 登录卡片：立体效果只用多层投影模拟，不用 3D 旋转（旋转会导致点击区域错位） */
  .login-card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 520px;
    background: linear-gradient(160deg, #ffffff 0%, #f7fdfe 60%, #eaf8fa 100%);
    border: 1px solid rgba(255, 255, 255, .95);
    border-radius: 28px;
    padding: 46px 44px 40px;
    transition: box-shadow .3s ease;
    /* 立体：多层错位投影模拟厚度 */
    box-shadow:
      10px 14px 0 -2px rgba(163, 226, 233, .55),
      20px 28px 0 -4px rgba(163, 226, 233, .35),
      30px 42px 0 -6px rgba(163, 226, 233, .18),
      0 40px 70px rgba(70, 150, 165, .35),
      inset 0 1px 0 rgba(255, 255, 255, .95),
      inset -6px -6px 16px rgba(150, 215, 225, .25);
  }
  .login-card:hover {
    box-shadow:
      10px 14px 0 -2px rgba(163, 226, 233, .6),
      20px 28px 0 -4px rgba(163, 226, 233, .4),
      30px 42px 0 -6px rgba(163, 226, 233, .22),
      0 44px 76px rgba(70, 150, 165, .42),
      inset 0 1px 0 rgba(255, 255, 255, .95),
      inset -6px -6px 16px rgba(150, 215, 225, .25);
  }

  .card-title { text-align: center; font-size: 25px; font-weight: 700; color: #2b3446; }
  .card-sub { text-align: center; font-size: 14px; color: #93a1b5; margin-top: 8px; margin-bottom: 26px; }

  .field { margin-bottom: 20px; }
  .field label { display: block; font-size: 15px; color: #5b6b80; margin-bottom: 8px; }
  .field input[type="text"],
  .field input[type="password"] {
    width: 100%;
    height: 50px;
    border: 1px solid #dfe7ef;
    border-radius: 12px;
    padding: 0 16px;
    font-size: 16px;
    color: #2b3446;
    background: #fff;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .field input:focus {
    border-color: #4d8bff;
    box-shadow: 0 0 0 3px rgba(77, 139, 255, .15);
  }
  .field input::placeholder { color: #b3becd; }

  /* 验证码行 */
  .captcha-row { display: flex; gap: 10px; }
  .captcha-row input { flex: 1; }
  .captcha {
    width: 128px;
    height: 50px;
    border-radius: 12px;
    background: linear-gradient(135deg, #e8f4ff 0%, #eef7ff 100%);
    border: 1px solid #dfe7ef;
    display: flex; align-items: center; justify-content: center;
    gap: 6px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #3b6dff;
    cursor: pointer;
    user-select: none;
    font-family: "Courier New", monospace;
  }
  .captcha span:nth-child(2) { color: #7c5cff; transform: rotate(-6deg); }
  .captcha span:nth-child(3) { color: #ff8a3d; transform: rotate(5deg); }
  .captcha span:nth-child(4) { color: #22b0c8; transform: rotate(-3deg); }

  /* 角色选择 */
  .roles { display: flex; gap: 12px; }
  .role {
    flex: 1;
    border: 1px solid #dfe7ef;
    border-radius: 12px;
    padding: 16px 0 14px;
    text-align: center;
    cursor: pointer;
    transition: all .2s;
    position: relative;
    user-select: none;
    -webkit-user-select: none;
    background: #fff;
  }
  .role:hover { border-color: #9db9ff; background: #f8fbff; }
  .role .radio {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 2px solid #cfd9e5;
    margin: 0 auto 8px;
    position: relative;
    transition: all .2s;
  }
  .role span { font-size: 15px; color: #5b6b80; }
  .role.active {
    border-color: #4d8bff;
    background: #f3f8ff;
  }
  .role.active .radio {
    border-color: #3b6dff;
    background: #3b6dff;
  }
  .role.active .radio::after {
    content: "";
    position: absolute;
    top: 3px; left: 3px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #fff;
  }
  .role.active span { color: #3b6dff; font-weight: 600; }

  /* 登录按钮 */
  .btn-login {
    width: 100%;
    height: 54px;
    margin-top: 22px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #4d8bff 0%, #3b6dff 100%);
    color: #fff;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 8px;
    text-indent: 8px;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(59, 109, 255, .35);
    transition: transform .15s, box-shadow .15s;
  }
  .btn-login:hover { transform: translateY(-1px); box-shadow: 0 14px 28px rgba(59, 109, 255, .42); }
  .btn-login:active { transform: translateY(0); }

  .card-links {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #93a1b5;
    margin-top: 14px;
  }

  .notice {
    margin-top: 16px;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12px;
    line-height: 1.7;
  }
  .notice-warn { background: #fff8ec; color: #b7791f; border: 1px solid #fdeccd; }
  .notice-info { background: #eef6ff; color: #3b6dff; border: 1px solid #d9e9ff; }

  .footer {
    position: fixed;
    left: 0; right: 0; bottom: 18px;
    font-size: 12px;
    color: #9fb0c2;
    text-align: center;
    z-index: 1;
  }

  @media (max-width: 860px) {
    .stage { flex-direction: column; gap: 28px; }
    .login-card { transform: none; padding: 28px 22px 24px; }
  }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="stage">
  <div class="stage-left">
    <div class="brand">
      <img class="brand-logo" src="logo.png" alt="周口师范学院校徽">
      <div class="brand-name">知教·智慧教育课程平台</div>
      <div class="brand-intro">知教·智慧教育课程平台，将 PPT 讲授、课堂教学活动、课前课后学习管理与轻量学情反馈融于一体。教师在此备课、授课、发布活动、批改作业；学生同步跟课、答题、提交作业、补学薄弱点。</div>
    </div>
  </div>

  <div class="stage-right">
    <div class="login-card">
  <div class="card-title" id="cardTitle">管理员登录</div>
  <div class="card-sub" id="cardSub">周口师范学院 · 教务管理端 · 仅限授权人员访问</div>

  <div class="field">
    <label>账号</label>
    <input type="text" id="accountInput" placeholder="请输入工号 / 管理员账号" autocomplete="username">
  </div>

  <div class="field">
    <label>密码</label>
    <input type="password" placeholder="请输入登录密码" autocomplete="current-password">
  </div>

  <div class="field">
    <label>验证码</label>
    <div class="captcha-row">
      <input type="text" placeholder="输入右侧字符">
      <div class="captcha" title="点击更换">
        <span>7</span><span>K</span><span>3</span><span>P</span>
      </div>
    </div>
  </div>

  <div class="field">
    <label>登录角色</label>
    <div class="roles">
      <div class="role active" data-role="admin">
        <div class="radio"></div>
        <span>管理员</span>
      </div>
      <div class="role" data-role="teacher">
        <div class="radio"></div>
        <span>教师</span>
      </div>
      <div class="role" data-role="student">
        <div class="radio"></div>
        <span>学生</span>
      </div>
    </div>
  </div>

  <button class="btn-login" id="loginBtn">登 录</button>

  <div class="card-links">
    <span>忘记密码请联系教务管理员</span>
    <span>HTTPS 加密连接</span>
  </div>

  <!-- 登录失败后显示的提示框 -->
  <div class="notice notice-warn" id="failNotice" style="display:none;">连续失败 10 次将锁定账号 15 分钟；登录过程会全量记入审计日志。</div>
    </div>
  </div>
</div>

<div class="footer">© 2026 周口师范学院 · 智慧教学平台 · 豫ICP备 XXXXXXXX 号</div>

<script>
  // 角色切换：联动卡片标题、副标题与账号输入提示
  var roleInfo = {
    admin:   { title: '管理员登录', sub: '周口师范学院 · 教务管理端 · 仅限授权人员访问', placeholder: '请输入工号 / 管理员账号' },
    teacher: { title: '教师登录',   sub: '周口师范学院 · 教学工作台 · 仅限授权人员访问', placeholder: '请输入工号 / 教师账号' },
    student: { title: '学生登录',   sub: '周口师范学院 · 学习空间 · 仅限授权人员访问',   placeholder: '请输入学号 / 学生账号' }
  };
  var rolesBox = document.querySelector('.roles');
  var cardTitle = document.getElementById('cardTitle');
  var cardSub = document.getElementById('cardSub');
  var accountInput = document.getElementById('accountInput');
  var roleEls = document.querySelectorAll('.role');

  function selectRole(el) {
    for (var i = 0; i < roleEls.length; i++) {
      roleEls[i].classList.remove('active');
    }
    el.classList.add('active');
    var info = roleInfo[el.getAttribute('data-role')];
    if (info) {
      cardTitle.textContent = info.title;
      cardSub.textContent = info.sub;
      accountInput.placeholder = info.placeholder;
    }
  }

  // 每个角色框直接绑定点击（兼容写法，不依赖 closest / NodeList.forEach）
  for (var i = 0; i < roleEls.length; i++) {
    (function (el) {
      el.addEventListener('click', function () { selectRole(el); });
    })(roleEls[i]);
  }

  // 容器上再做一层委托作为兜底
  rolesBox.addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== rolesBox && (!el.classList || !el.classList.contains('role'))) {
      el = el.parentNode;
    }
    if (el && el !== rolesBox && el.classList && el.classList.contains('role')) {
      selectRole(el);
    }
  });

  // 登录：原型演示，点击即视为一次失败尝试，弹出淡黄色提示框
  var failNotice = document.getElementById('failNotice');
  document.getElementById('loginBtn').addEventListener('click', function () {
    failNotice.style.display = 'block';
  });

  // 验证码点击更换
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  document.querySelector('.captcha').addEventListener('click', function () {
    var html = '';
    for (var i = 0; i < 4; i++) {
      html += '<span>' + chars.charAt(Math.floor(Math.random() * chars.length)) + '</span>';
    }
    this.innerHTML = html;
  });
</script>

</body>
</html>
