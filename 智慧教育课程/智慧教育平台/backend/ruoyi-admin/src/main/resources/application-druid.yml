# Druid 数据源（profile=druid）。库连接必填项来自环境变量，见 backend/.env.example。
# 推荐本机库：zhijiao_m0（若依 sys_*/QRTZ_* + 教育业务表 + 演示数据）
# 一键初始化：sql/zhijiao-m0-all-in-one.sql 或 sql/setup-zhijiao-m0.ps1

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      master:
        # 例：jdbc:mysql://127.0.0.1:3306/zhijiao_m0?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
        url: jdbc:mysql://127.0.0.1:3306/zhijiao_m0?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
        username: root
        password: Qln521++
#      slave:
#        enabled: false
#        url:
#        username:
#        password:
      initialSize: 5
      minIdle: 10
      maxActive: 20
      maxWait: 60000
      connectTimeout: 30000
      socketTimeout: 60000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      maxEvictableIdleTimeMillis: 900000
      validationQuery: SELECT 1
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: true
      statViewServlet:
        enabled: false
        allow:
        url-pattern: /druid/*
        # 若开启控制台，务必改掉默认口令并限制 allow
        login-username: ${DRUID_STAT_USERNAME:ruoyi}
        login-password: ${DRUID_STAT_PASSWORD:123456}
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
