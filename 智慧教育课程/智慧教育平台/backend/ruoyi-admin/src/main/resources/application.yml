# 知教 · 智慧教育课程平台（基于若依 3.9.2 / Spring Boot 3）
# 敏感项通过环境变量或 backend/.env（由 run-local.ps1 注入）提供，勿写入仓库。

ruoyi:
  name: 知教
  version: 3.9.2
  copyrightYear: 2026
  # 上传目录：Windows 示例 D:/zhijiao/uploadPath；Linux 示例 /home/zhijiao/uploadPath
  profile: ${RUOYI_PROFILE:D:/zhijiao/uploadPath}
  addressEnabled: false
  # math 数字计算 | char 字符验证
  captchaType: math

# 教学业务本地扩展（课件预览等）
zhijiao:
  resource:
    # 课件页预览根目录；相对路径来自 edu_resource_page.preview_storage_key
    # 未配置时预览接口返回 503，不误报 404
    preview-root: ${ZHIJIAO_PREVIEW_ROOT:}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 800
      min-spare: 100

logging:
  level:
    com.ruoyi: ${LOG_LEVEL_RUOYI:info}
    com.ruoyi.education: ${LOG_LEVEL_EDUCATION:debug}
    org.springframework: warn

user:
  password:
    maxRetryCount: 5
    lockTime: 10

spring:
  application:
    name: zhijiao-education
  messages:
    basename: i18n/messages
  profiles:
    active: druid
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd HH:mm:ss
  devtools:
    restart:
      enabled: true
  data:
    redis:
      host: ${RUOYI_REDIS_HOST:localhost}
      port: ${RUOYI_REDIS_PORT:6379}
      database: ${RUOYI_REDIS_DATABASE:15}
      password: ${RUOYI_REDIS_PASSWORD:}
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms

token:
  header: Authorization
  # 必填：随机长密钥，见 backend/.env.example
  secret: ${RUOYI_TOKEN_SECRET}
  expireTime: ${TOKEN_EXPIRE_MINUTES:30}

mybatis:
  typeAliasesPackage: com.ruoyi.**.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml

pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: default
      display-name: 系统与工具
      paths-to-match: /system/**,/monitor/**,/tool/**,/common/**,/login,/getInfo,/getRouters,/captchaImage
      packages-to-scan: com.ruoyi.web.controller
    - group: education
      display-name: 教学业务
      paths-to-match: /education/**
      packages-to-scan: com.ruoyi.education

referer:
  enabled: false
  allowed-domains: localhost,127.0.0.1

xss:
  enabled: true
  excludes: /system/notice
  urlPatterns: /system/*,/monitor/*,/tool/*
