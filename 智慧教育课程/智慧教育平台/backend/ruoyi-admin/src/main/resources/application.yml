# 知教 · 智慧教育课程平台（基于若依 3.9.2 / Spring Boot 3）
# 本机直写配置，勿提交含密码/密钥的改动。

ruoyi:
  name: 知教
  version: 3.9.2
  copyrightYear: 2026
  profile: D:/zhijiao/uploadPath
  addressEnabled: false
  captchaType: math

zhijiao:
  resource:
    preview-root:

server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 800
      min-spare: 100

logging:
  level:
    com.ruoyi: info
    com.ruoyi.education: debug
    org.springframework: warn

user:
  password:
    maxRetryCount: 5
    lockTime: 10

spring:
  application:
    name: zhijiao-education
  messages:
    basename: i18n/messages
  profiles:
    active: druid
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd HH:mm:ss
  devtools:
    restart:
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 15
      password:
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms

token:
  header: Authorization
  secret: 6f81cde545e94d84a2d89c279a47d4efe9a22d703bca4e1486b61155fab13f65
  # 本机联调默认 8 小时；活跃请求在到期前 20 分钟内会自动续期
  expireTime: 480

mybatis:
  typeAliasesPackage: com.ruoyi.**.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml

pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: default
      display-name: 系统与工具
      paths-to-match: /system/**,/monitor/**,/tool/**,/common/**,/login,/getInfo,/getRouters,/captchaImage
      packages-to-scan: com.ruoyi.web.controller
    - group: education
      display-name: 教学业务
      paths-to-match: /education/**
      packages-to-scan: com.ruoyi.education

referer:
  enabled: false
  allowed-domains: localhost,127.0.0.1

xss:
  enabled: true
  excludes: /system/notice
  urlPatterns: /system/*,/monitor/*,/tool/*
