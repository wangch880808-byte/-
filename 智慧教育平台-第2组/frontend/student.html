<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知教·智慧教育课程平台 - 学生端</title>
<link rel="stylesheet" href="/edu.css?v=20261029b">
<link rel="stylesheet" href="/xt.css?v=20261029b">
</head>
<body class="auth-pending" data-role="student">

<div id="authStatus" role="status">
  <span id="authMessage">正在核验登录信息…</span>
  <button type="button" id="authRetry" hidden>重试</button>
</div>

<div class="xt-shell">

  <aside class="xt-sidebar">
    <a class="xt-brand" href="/student.html" title="知教">
      <img src="/logo.png" alt="校徽">
      <span>知教</span>
    </a>

    <nav class="xt-nav" id="xtNav">
      <a href="/student.html" data-nav="home" class="active" title="首页">
        <svg class="xt-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/>
        </svg>
        <span>首页</span>
      </a>
      <a href="/student.html" data-nav="course" title="我的课程">
        <svg class="xt-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20"/>
        </svg>
        <span>我的课程</span>
      </a>
      <a data-nav="message" title="消息">
        <svg class="xt-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 11.5a8 8 0 0 1-8 8H8l-5 3 1.4-4.2A8 8 0 0 1 13 3.5a8 8 0 0 1 8 8z"/>
        </svg>
        <span>消息</span>
      </a>
      <a data-nav="me" title="我的">
        <svg class="xt-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/>
        </svg>
        <span>我的</span>
      </a>
    </nav>

    <div class="xt-side-foot">
      <div class="xt-user">
        <span class="avatar" title="学生">学</span>
        <div class="xt-user-meta">
          <b>学生</b>
          <small>知教 · 学生端</small>
        </div>
      </div>
      <button type="button" class="xt-logout" id="logoutBtn">
        <span class="xt-logout-full">退出登录</span>
        <span class="xt-logout-short">退出</span>
      </button>
    </div>
  </aside>

  <div class="xt-body">
    <header class="xt-topbar">
      <div class="xt-crumb" id="xtCrumb">首页</div>
      <div class="xt-search">
        <input id="xtSearch" type="search" placeholder="搜索我的课程" autocomplete="off">
      </div>
    </header>

    <main class="main">
      <!-- 标题放在 .content 外面：页面渲染会整体替换 .content，放里面第二次挂载就取不到标题了 -->
      <div class="page-title" id="pageTitle">课程详情</div>
      <div class="content"></div>
    </main>
  </div>

</div>

<script src="/role-home.js?v=20261029b"></script>
<script src="/edu-ui.js?v=20261029b"></script>
<script src="/edu-api.js?v=20261029b"></script>

<script src="/pages-student.js?v=20261029b"></script>
<script src="/edu-boot.js?v=20261029b"></script>
<script src="/xt-shell.js?v=20261029b"></script>
</body>
</html>
